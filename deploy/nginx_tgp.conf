server {
    listen 80;
    server_name tgp.tgis.vu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tgp.tgis.vu;

    ssl_certificate     /etc/letsencrypt/live/tgp.tgis.vu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tgp.tgis.vu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # NO кэш на nginx (получал партиал и держал 7 дней).
        proxy_cache        off;

        # NO буферизации — отдаём байты в TG потоком, без задержки.
        # С буферизацией nginx ждёт весь ответ, потом шлёт; если что-то
        # тайм-аутит на TG-стороне в процессе чтения — клиент получает
        # обрезанный JPEG (отсюда серые полосы).
        proxy_buffering    off;
        proxy_request_buffering off;
    }
}
